    <style>
        /* Custom styling for sticky note aesthetic */
        .sticky-note {
            box-shadow: 3px 5px 12px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .sticky-note:hover {
            box-shadow: 6px 12px 20px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }
        .sticky-note.dragging {
            opacity: 0.6;
            transform: scale(0.98) rotate(2deg);
        }
        .drag-over-column {
            background-color: rgba(226, 232, 240, 0.8);
            border: 2px dashed #94a3b8;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        [contenteditable]:focus {
            outline: none;
        }
    </style>

    <script>
        // Color palette choices
        const COLOR_SCHEMES = {
            yellow: { bg: 'bg-yellow-100', header: 'bg-yellow-200/80', border: 'border-yellow-300', text: 'text-amber-900', btn: 'bg-yellow-300' },
            pink: { bg: 'bg-pink-100', header: 'bg-pink-200/80', border: 'border-pink-300', text: 'text-pink-900', btn: 'bg-pink-300' },
            blue: { bg: 'bg-sky-100', header: 'bg-sky-200/80', border: 'border-sky-300', text: 'text-sky-900', btn: 'bg-sky-300' },
            green: { bg: 'bg-emerald-100', header: 'bg-emerald-200/80', border: 'border-emerald-300', text: 'text-emerald-900', btn: 'bg-emerald-300' },
            orange: { bg: 'bg-orange-100', header: 'bg-orange-200/80', border: 'border-orange-300', text: 'text-orange-900', btn: 'bg-orange-300' },
            purple: { bg: 'bg-purple-100', header: 'bg-purple-200/80', border: 'border-purple-300', text: 'text-purple-900', btn: 'bg-purple-300' }
        };

        // Default initial columns data
        const DEFAULT_COLUMNS = [
            { id: 'col-todo', title: '📋 待辦事項' },
            { id: 'col-doing', title: '🚀 進行中' },
            { id: 'col-done', title: '✅ 已完成' }
        ];

        // Default initial sticky notes
        const DEFAULT_NOTES = [
            {
                id: 'note-1',
                columnId: 'col-todo',
                title: '歡迎使用便利貼！',
                content: '點擊此處可以直接編輯內容。點選右上角顏色按鈕可更換色彩！',
                color: 'yellow',
                updatedAt: new Date().toISOString()
            },
            {
                id: 'note-2',
                columnId: 'col-doing',
                title: '拖曳功能',
                content: '你可以將便利貼拖曳到其他欄位，或是同一欄位中重新排版。',
                color: 'blue',
                updatedAt: new Date().toISOString()
            },
            {
                id: 'note-3',
                columnId: 'col-done',
                title: '資料自動儲存',
                content: '所有變更都會自動儲存至 LocalStorage，重整理頁面也不會遺失！',
                color: 'green',
                updatedAt: new Date().toISOString()
            }
        ];

        // App state
        let columns = [];
        let notes = [];
        let searchQuery = '';
        let draggedNoteId = null;

        function loadData() {
            try {
                const savedCols = localStorage.getItem('sticky_board_columns');
                const savedNotes = localStorage.getItem('sticky_board_notes');

                columns = savedCols ? JSON.parse(savedCols) : DEFAULT_COLUMNS;
                notes = savedNotes ? JSON.parse(savedNotes) : DEFAULT_NOTES;
            } catch (e) {
                console.error('Failed to load from LocalStorage:', e);
                columns = DEFAULT_COLUMNS;
                notes = DEFAULT_NOTES;
            }
        }

        function saveData() {
            try {
                localStorage.setItem('sticky_board_columns', JSON.stringify(columns));
                localStorage.setItem('sticky_board_notes', JSON.stringify(notes));
            } catch (e) {
                console.error('Failed to save to LocalStorage:', e);
                showToast('儲存資料失敗，請檢查空間限制', 'error');
            }
        }

        function renderBoard() {
            const container = document.getElementById('boardContainer');
            container.innerHTML = '';

            columns.forEach(column => {
                const columnEl = createColumnElement(column);
                container.appendChild(columnEl);
            });

            // Re-bind global drag event handlers for board columns
            setupColumnDragListeners();
        }

        function createColumnElement(column) {
            const colDiv = document.createElement('div');
            colDiv.className = 'kanban-column flex-shrink-0 w-80 sm:w-88 bg-slate-200/60 rounded-2xl p-4 flex flex-col max-h-full border border-slate-300/50 shadow-inner transition-colors duration-200';
            colDiv.dataset.columnId = column.id;

            // Column Header
            const filteredNotes = notes.filter(n => n.columnId === column.id && 
                (n.title.toLowerCase().includes(searchQuery) || n.content.toLowerCase().includes(searchQuery))
            );

            colDiv.innerHTML = `
                <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-300/60">
                    <div class="flex items-center gap-2 flex-1">
                        <span class="font-bold text-slate-700 text-base outline-none focus:bg-white focus:px-2 focus:py-0.5 focus:rounded" 
                              contenteditable="true" data-action="edit-col-title">${escapeHTML(column.title)}</span>
                        <span class="bg-slate-300/80 text-slate-600 text-xs font-semibold px-2 py-0.5 rounded-full">${filteredNotes.length}</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <button data-action="add-note" title="在這個欄位新增便利貼" class="text-slate-500 hover:text-amber-600 hover:bg-slate-300/50 p-1.5 rounded-lg transition-all">
                            <i class="fa-solid fa-plus text-sm"></i>
                        </button>
                        <button data-action="delete-col" title="刪除欄位" class="text-slate-400 hover:text-red-500 hover:bg-slate-300/50 p-1.5 rounded-lg transition-all">
                            <i class="fa-solid fa-xmark text-sm"></i>
                        </button>
                    </div>
                </div>
                <div class="notes-list flex-1 overflow-y-auto space-y-4 pr-1 min-h-[150px]">
                    <!-- Sticky Notes go here -->
                </div>
            `;

            // Append sticky notes
            const notesListDiv = colDiv.querySelector('.notes-list');
            filteredNotes.forEach(note => {
                notesListDiv.appendChild(createNoteElement(note));
            });

            // Bind Column Event Listeners
            const titleEl = colDiv.querySelector('[data-action="edit-col-title"]');
            titleEl.addEventListener('blur', (e) => {
                const newTitle = e.target.innerText.trim();
                if (newTitle) {
                    column.title = newTitle;
                    saveData();
                } else {
                    e.target.innerText = column.title;
                }
            });
            titleEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    e.target.blur();
                }
            });

            colDiv.querySelector('[data-action="add-note"]').addEventListener('click', () => {
                addNewNote(column.id);
            });

            colDiv.querySelector('[data-action="delete-col"]').addEventListener('click', () => {
                deleteColumn(column.id);
            });

            return colDiv;
        }

        function createNoteElement(note) {
            const scheme = COLOR_SCHEMES[note.color] || COLOR_SCHEMES.yellow;
            const noteDiv = document.createElement('div');
            noteDiv.className = `sticky-note ${scheme.bg} ${scheme.border} border rounded-xl p-4 flex flex-col gap-2 relative cursor-grab active:cursor-grabbing select-none group`;
            noteDiv.draggable = true;
            noteDiv.dataset.noteId = note.id;

            const timeFormatted = new Date(note.updatedAt).toLocaleDateString('zh-TW', {
                month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            noteDiv.innerHTML = `
                <!-- Color Selector Toolbar (Shown on Hover) -->
                <div class="opacity-0 group-hover:opacity-100 transition-opacity absolute -top-3 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-sm border border-slate-200 rounded-full px-2 py-1 shadow-md flex items-center gap-1.5 z-20">
                    ${Object.keys(COLOR_SCHEMES).map(c => `
                        <button data-color="${c}" class="w-4 h-4 rounded-full ${COLOR_SCHEMES[c].btn} border border-black/10 transition-transform hover:scale-125 ${note.color === c ? 'ring-2 ring-slate-600 ring-offset-1' : ''}"></button>
                    `).join('')}
                </div>

                <!-- Note Header -->
                <div class="flex items-start justify-between gap-2">
                    <div class="font-bold text-slate-800 text-base leading-snug w-full outline-none focus:bg-white/50 focus:p-1 focus:rounded" 
                         contenteditable="true" data-action="edit-note-title" placeholder="標題...">${escapeHTML(note.title)}</div>
                    <button data-action="delete-note" class="text-slate-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-1 -mr-1 -mt-1 rounded">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                </div>

                <!-- Note Body Content -->
                <div class="text-slate-700 text-sm whitespace-pre-wrap outline-none min-h-[60px] focus:bg-white/50 focus:p-1 focus:rounded font-sans" 
                     contenteditable="true" data-action="edit-note-content" placeholder="寫些什麼...">${escapeHTML(note.content)}</div>

                <!-- Note Footer -->
                <div class="flex items-center justify-between text-[10px] text-slate-400 mt-1 pt-2 border-t border-black/5">
                    <span class="font-mono"><i class="fa-regular fa-clock mr-1"></i>${timeFormatted}</span>
                    <i class="fa-solid fa-grip-dots-vertical text-slate-300"></i>
                </div>
            `;

            // Note Editable Handlers
            const titleEl = noteDiv.querySelector('[data-action="edit-note-title"]');
            const contentEl = noteDiv.querySelector('[data-action="edit-note-content"]');

            const handleUpdate = () => {
                note.title = titleEl.innerText.trim();
                note.content = contentEl.innerText.trim();
                note.updatedAt = new Date().toISOString();
                saveData();
            };

            titleEl.addEventListener('blur', handleUpdate);
            contentEl.addEventListener('blur', handleUpdate);

            // Prevent drag event when editing text
            [titleEl, contentEl].forEach(el => {
                el.addEventListener('mousedown', (e) => e.stopPropagation());
            });

            // Color Selector Handler
            noteDiv.querySelectorAll('[data-color]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const newColor = btn.dataset.color;
                    note.color = newColor;
                    note.updatedAt = new Date().toISOString();
                    saveData();
                    renderBoard();
                });
            });

            // Delete Note Handler
            noteDiv.querySelector('[data-action="delete-note"]').addEventListener('click', (e) => {
                e.stopPropagation();
                deleteNote(note.id);
            });

            // HTML5 Drag and Drop Events for Sticky Note
            noteDiv.addEventListener('dragstart', (e) => {
                draggedNoteId = note.id;
                noteDiv.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', note.id);
            });

            noteDiv.addEventListener('dragend', () => {
                draggedNoteId = null;
                noteDiv.classList.remove('dragging');
                document.querySelectorAll('.kanban-column').forEach(col => col.classList.remove('drag-over-column'));
            });

            return noteDiv;
        }

        function setupColumnDragListeners() {
            const columnsEls = document.querySelectorAll('.kanban-column');

            columnsEls.forEach(colEl => {
                colEl.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    colEl.classList.add('drag-over-column');
                });

                colEl.addEventListener('dragleave', (e) => {
                    if (!colEl.contains(e.relatedTarget)) {
                        colEl.classList.remove('drag-over-column');
                    }
                });

                colEl.addEventListener('drop', (e) => {
                    e.preventDefault();
                    colEl.classList.remove('drag-over-column');

                    const targetColumnId = colEl.dataset.columnId;
                    if (!draggedNoteId || !targetColumnId) return;

                    const noteIndex = notes.findIndex(n => n.id === draggedNoteId);
                    if (noteIndex !== -1) {
                        notes[noteIndex].columnId = targetColumnId;
                        notes[noteIndex].updatedAt = new Date().toISOString();
                        saveData();
                        renderBoard();
                        showToast('已移動便利貼', 'info');
                    }
                });
            });
        }

        function addNewNote(columnId) {
            const targetCol = columnId || (columns.length > 0 ? columns[0].id : null);
            if (!targetCol) {
                showToast('請先新增一個看板欄位！', 'error');
                return;
            }

            const colors = Object.keys(COLOR_SCHEMES);
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            const newNote = {
                id: 'note-' + Date.now(),
                columnId: targetCol,
                title: '新便利貼',
                content: '點擊點選編輯詳細內容...',
                color: randomColor,
                updatedAt: new Date().toISOString()
            };

            notes.unshift(newNote);
            saveData();
            renderBoard();
            showToast('已新增便利貼', 'success');
        }

        function deleteNote(noteId) {
            notes = notes.filter(n => n.id !== noteId);
            saveData();
            renderBoard();
            showToast('已刪除便利貼', 'info');
        }

        function addNewColumn() {
            const title = prompt('請輸入新欄位名稱：', '新項目欄');
            if (title && title.trim()) {
                const newCol = {
                    id: 'col-' + Date.now(),
                    title: title.trim()
                };
                columns.push(newCol);
                saveData();
                renderBoard();
                showToast('已新增欄位', 'success');
            }
        }

        function deleteColumn(columnId) {
            const colNotesCount = notes.filter(n => n.columnId === columnId).length;
            
            if (colNotesCount > 0) {
                if (!confirm(`該欄位內包含 ${colNotesCount} 張便利貼，確定要連同欄位一併刪除嗎？`)) {
                    return;
                }
            }

            columns = columns.filter(c => c.id !== columnId);
            notes = notes.filter(n => n.columnId !== columnId);
            saveData();
            renderBoard();
            showToast('已刪除欄位', 'info');
        }

        function clearAllData() {
            if (confirm('確定要清空看板上的所有便利貼與欄位嗎？此操作無法復原。')) {
                localStorage.removeItem('sticky_board_columns');
                localStorage.removeItem('sticky_board_notes');
                columns = DEFAULT_COLUMNS;
                notes = DEFAULT_NOTES;
                saveData();
                renderBoard();
                showToast('已重置為預設看板', 'info');
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : 'bg-slate-800';
            
            toast.className = `${bgClass} text-white text-sm py-2 px-4 rounded-xl shadow-lg transition-all transform translate-y-4 opacity-0 flex items-center gap-2 pointer-events-auto`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info'} text-xs"></i>
                <span>${message}</span>
            `;

            container.appendChild(toast);

            // Animate in
            setTimeout(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            }, 10);

            // Animate out & remove
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function escapeHTML(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderBoard();

            // Header Button Events
            document.getElementById('addNoteBtn').addEventListener('click', () => addNewNote());
            document.getElementById('addColumnBtn').addEventListener('click', addNewColumn);
            document.getElementById('clearAllBtn').addEventListener('click', clearAllData);

            // Search Event Listener
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase().trim();
                renderBoard();
            });
        });
    </script>

</body></html>
